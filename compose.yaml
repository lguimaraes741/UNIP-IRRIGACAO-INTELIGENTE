name: tcc-irrigacao
services:
  postgres:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_DB: irrigation
      POSTGRES_USER: irrigation
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?execute bootstrap}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:?execute bootstrap}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U irrigation -d irrigation']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  mosquitto:
    image: eclipse-mosquitto:2@sha256:38c0da4f2ef84284d47b3b3eeea1cb3bdeabe81ee10caf0cd5c5ff61ee3ea408
    entrypoint: [sh, /mosquitto/config/entrypoint.sh]
    environment:
      MQTT_BACKEND_PASSWORD: ${MQTT_BACKEND_PASSWORD:?execute bootstrap}
      MQTT_SIM_PASSWORD: ${MQTT_SIM_PASSWORD:?execute bootstrap}
      MQTT_DEVICE_PASSWORD: ${MQTT_DEVICE_PASSWORD:?execute tools/rotate-broker-cert.py}
    # Exposed to the home network for the ESP32 (TLS + per-device user/ACL); other services stay local.
    ports: ['8883:8883']
    volumes:
      - ./infra/mosquitto:/mosquitto/config:ro
      - ./.local/certs:/certs:ro
      - mqttdata:/mosquitto/data
    restart: unless-stopped
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: tcc-irrigacao-backend:local
    environment: &app_environment
      DATABASE_URL: postgresql://irrigation_app:${APP_DATABASE_PASSWORD:?execute bootstrap}@postgres:5432/irrigation
      AUTO_MIGRATE: 'false'
      SIMULATION_CONTROL_ENABLED: 'true'
      # Physical pumps: off unless PHYSICAL_CONTROL_ENABLED=true in .env (after flow/soil calibration).
      PHYSICAL_CONTROL_ENABLED: ${PHYSICAL_CONTROL_ENABLED:-false}
      MODEL_PATH: /models/active.json
      API_TOKEN: ${API_TOKEN:?execute bootstrap}
      MQTT_BACKEND_PASSWORD: ${MQTT_BACKEND_PASSWORD}
      MQTT_SIM_PASSWORD: ${MQTT_SIM_PASSWORD}
      MQTT_HOST: mosquitto
    ports: ['127.0.0.1:8000:8000']
    volumes:
      - ./models:/models:ro
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://localhost:8000/health")']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  migrate:
    image: tcc-irrigacao-backend:local
    pull_policy: never
    command: [python, tools/migrate.py]
    environment:
      ADMIN_DATABASE_URL: postgresql://irrigation:${POSTGRES_PASSWORD}@postgres:5432/irrigation
      APP_DATABASE_PASSWORD: ${APP_DATABASE_PASSWORD}
    volumes: ['./infra/postgres:/app/migrations:ro']
    depends_on:
      postgres:
        condition: service_healthy
  ingestion:
    image: tcc-irrigacao-backend:local
    pull_policy: never
    command: [python, -m, app.worker]
    environment: *app_environment
    volumes: ['./.local/certs/ca.crt:/certs/ca.crt:ro']
    depends_on:
      backend:
        condition: service_healthy
      mosquitto:
        condition: service_started
    restart: unless-stopped
  dispatcher:
    image: tcc-irrigacao-backend:local
    pull_policy: never
    command: [python, -m, app.dispatcher]
    environment: *app_environment
    volumes: ['./.local/certs/ca.crt:/certs/ca.crt:ro']
    depends_on:
      backend:
        condition: service_healthy
      mosquitto:
        condition: service_started
    restart: unless-stopped
  controller:
    image: tcc-irrigacao-backend:local
    pull_policy: never
    profiles: [control]
    command: [python, -m, app.controller_service]
    environment: *app_environment
    volumes: ['./models:/models:ro', './.local/certs/ca.crt:/certs/ca.crt:ro']
    depends_on:
      backend:
        condition: service_healthy
      mosquitto:
        condition: service_started
    restart: unless-stopped
  bench-ui:
    # Local bench page: live readings and guided weighing tests (read-only DB; sessions as files).
    image: tcc-irrigacao-backend:local
    pull_policy: never
    command: [uvicorn, app.bench:app, --host, 0.0.0.0, --port, '8090']
    environment:
      DATABASE_URL: postgresql://irrigation_app:${APP_DATABASE_PASSWORD:?execute bootstrap}@postgres:5432/irrigation
      BENCH_DEVICE: esp32-01
      BENCH_SESSIONS: /sessions
      BENCH_REFILLS: /refills
      BENCH_EXPERIMENT: tcc-2026
      MQTT_BACKEND_PASSWORD: ${MQTT_BACKEND_PASSWORD}
      MQTT_HOST: mosquitto
    ports: ['127.0.0.1:8090:8090']
    volumes: ['./data/raw/sessoes-balanca:/sessions', './data/raw/reposicoes:/refills', './data/raw/acionamentos:/pump-tests', './data/raw/calibracao-solo:/soil', './.local/certs/ca.crt:/certs/ca.crt:ro']
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  grafana:
    image: grafana/grafana:12.2.0@sha256:74144189b38447facf737dfd0f3906e42e0776212bf575dc3334c3609183adf7
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?execute bootstrap}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD}
    ports: ['127.0.0.1:3000:3000']
    volumes:
      - grafanadata:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  simulator:
    image: tcc-irrigacao-backend:local
    pull_policy: never
    profiles: [simulation]
    command: [python, simulate.py]
    environment: *app_environment
    volumes:
      - ./.local/certs/ca.crt:/certs/ca.crt:ro
      - ./.local/simulator:/state
      - ./data:/data
      - ./models:/models
    depends_on:
      ingestion:
        condition: service_started
      dispatcher:
        condition: service_started
  backup:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    profiles: [backup]
    entrypoint: [sh, /scripts/backup-loop.sh]
    environment:
      PGPASSWORD: ${GRAFANA_DB_PASSWORD}
      BACKUP_INTERVAL_SECONDS: '86400'
    volumes:
      - ./infra/backup/loop.sh:/scripts/backup-loop.sh:ro
      - ./.local/backups:/backups
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
volumes:
  pgdata:
  mqttdata:
  grafanadata:
